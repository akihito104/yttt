pluginManagement {
    includeBuild("build-logic")
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            // https://github.com/google/play-services-plugins/issues/223
            if (requested.id.id == "com.google.android.gms.oss-licenses-plugin") {
                useModule("com.google.android.gms:oss-licenses-plugin:${requested.version}")
            }
        }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "yttt"
include ':app'
include ':lib'
include ':common'
include ':common-ui'
include ':platforms:youtube:feature'
include ':platforms:youtube:repository'
include ':platforms:youtube:model'
include ':platforms:twitch:feature'
include ':platforms:twitch:repository'
include ':platforms:twitch:model'
include ':repository-appuser'
include ':data-local-room'
include ':image-loadable-glide'
include ':image-loadable-coil'
